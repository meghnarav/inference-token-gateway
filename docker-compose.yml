# ──────────────────────────────────────────────────────────────────────────────
# Inference Token Gateway — Docker Compose
#
# Services:
#   gateway    - Spring Boot application (port 8080)
#   postgres   - PostgreSQL 16 (port 5432)
#   redis      - Redis 7 (port 6379)
#   redis-cli  - Optional admin CLI (comment in to use)
#
# Usage:
#   docker compose up --build          # First run (builds the JAR)
#   docker compose up -d               # Detached mode
#   docker compose logs -f gateway     # Stream app logs
#   docker compose down -v             # Destroy including volumes
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       tokengateway
      POSTGRES_USER:     gateway_user
      POSTGRES_PASSWORD: gateway_pass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d tokengateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Kafka (KRaft, no ZooKeeper) ────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: gateway-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Gateway Application ─────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Database
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       tokengateway
      POSTGRES_USER:     gateway_user
      POSTGRES_PASSWORD: gateway_pass
      # Redis
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USAGE_TOPIC: token-usage-events
      # Rate limiting
      RATE_LIMIT_TOKENS_PER_MINUTE: 1000    # Low limit for demo purposes
      RATE_LIMIT_ENABLED:           true
      # Cache
      CACHE_TTL_SECONDS: 300
      # LLM backend
      LLM_PROVIDER:           ${LLM_PROVIDER:-simulated}
      OPENAI_API_KEY:         ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL:        ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_DEFAULT_MODEL:   ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL:        ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL:   ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      LLM_READ_TIMEOUT_MS:    ${LLM_READ_TIMEOUT_MS:-120000}
      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: gateway-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: gateway-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    container_name: gateway-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
